name: Prepare updated unpublished component release

on:
  workflow_dispatch:
    inputs:
      component:
        description: Draft to update from a successful branch push
        required: true
        type: choice
        default: Editor
        options: [Editor, server]
      source_sha:
        description: Exact component commit with successful required workflows
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: forge-component-release-v0.5.2
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          path: component-source
          persist-credentials: false
      - name: Validate packages and replace the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPONENT: ${{ inputs.component }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: python scripts/prepare_editor_release.py --component "$COMPONENT" --sha "$SOURCE_SHA" --source component-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: prepared-component
          path: prepared-component.json
          if-no-files-found: warn
