name: Editor CodeQL

on:
  push:
    branches: [Editor]
  pull_request:
    branches: [Editor]
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  contents: read

concurrency:
  group: editor-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: C++ / Qt security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1, direct Node 24 action
        with:
          version: "6.8.3"
          aqtversion: "==3.3.0"
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Configure instrumented build
        run: >-
          cmake -S . -B build/codeql -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=OFF
          -DFORGE_EDITOR_WARNINGS_AS_ERRORS=ON
          -DFORGE_EDITOR_REQUIRE_WEBENGINE=ON
      - name: Compile instrumented build
        run: cmake --build build/codeql --parallel 2
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
