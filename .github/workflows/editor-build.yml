name: Editor build

on:
  push:
    branches: [Editor]
  pull_request:
    branches: [Editor]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Source, ownership and CMake preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Validate Editor-only source contract
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          root = pathlib.Path.cwd()
          forbidden = [
              ".dockerignore",
              ".env.example",
              ".python-version",
              "Dockerfile",
              "Makefile",
              "app",
              "clients",
              "deploy",
              "docker-compose.example.yml",
              "docs",
              "example-apps",
              "forge.py",
              "framework",
              "json_api_forge",
              "main.py",
              "passenger_wsgi.py",
              "pyproject.toml",
              "requirements-dev.txt",
              "requirements.txt",
              "run.py",
              "schemas",
              "tests",
          ]
          leaked = [name for name in forbidden if (root / name).exists()]
          if leaked:
              raise SystemExit(f"non-Editor source leaked into Editor branch: {leaked}")
          scripts = sorted(path.name for path in (root / "scripts").iterdir())
          if scripts != ["check_manifest.py"]:
              raise SystemExit(f"unexpected Editor scripts: {scripts}")
          workflows = sorted(path.name for path in (root / ".github/workflows").glob("*.yml"))
          if workflows != ["editor-build.yml", "editor-codeql.yml"]:
              raise SystemExit(f"unexpected Editor workflows: {workflows}")
          if (root / "VERSION").read_text().strip() != "0.5.2":
              raise SystemExit("root VERSION mismatch")
          cmake = (root / "editor/CMakeLists.txt").read_text()
          if not re.search(r"project\(JSONAPIForgeEditor VERSION 0\.5\.2", cmake):
              raise SystemExit("Editor CMake version mismatch")
          required = [
              "editor/src/MainWindow.cpp",
              "editor/src/ApiClient.cpp",
              "editor/src/TeamWorkspace.cpp",
              "editor/src/VisualDesigner.cpp",
              "editor/src/GraphModel.cpp",
              "editor/src/NodeGraphEditor.cpp",
              "editor/src/EditorSettings.cpp",
              "editor/src/PluginManager.cpp",
              "editor/src/PluginCatalogClient.cpp",
              "editor/src/PythonSdkPanel.cpp",
              "editor/src/TemplateManager.cpp",
              "editor/include/forgeeditor/IEditorPlugin.hpp",
              "editor/resources/styles/dark.qss",
              "editor/resources/templates/catalog.json",
              "editor/resources/logo.png",
              "editor/resources/brand-mark-transparent.png",
              "editor/resources/forge-editor.ico",
              "editor/resources/forge-editor.icns",
              "editor/packaging/qtifw/config/config.xml",
              "editor/packaging/qtifw/config/config-linux.xml",
              "editor/packaging/qtifw/config/config-macos.xml",
              "editor/packaging/qtifw/config/installer.qss",
              "editor/packaging/qtifw/build-installer.ps1",
              "editor/packaging/windows/editor.iss",
              "editor/packaging/windows/build-installer.ps1",
              "editor/packaging/windows/prepare-tools.ps1",
              "editor/tests/test_windows_installer.py",
              "editor/packaging/qtifw/build-installer.sh",
              "editor/packaging/qtifw/create-dmg.sh",
              "editor/packaging/qtifw/packages/dev.jsonapiforge.editor/meta/package.xml",
              "editor/packaging/qtifw/packages/dev.jsonapiforge.editor/meta/installscript.qs",
              "QT-CREATOR-BUILD-GUIDE.md",
              "editor/packaging/linux/launcher.sh",
              "editor/packaging/linux/bundle-qt.sh",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing Editor release files: {missing}")
          if (root / "editor/packaging/windows/installer.nsi").exists():
              raise SystemExit("legacy NSIS metadata must not coexist with the Qt IFW installer")
          ifw_configs = [
              ET.parse(root / path).getroot()
              for path in (
                  "editor/packaging/qtifw/config/config.xml",
                  "editor/packaging/qtifw/config/config-linux.xml",
                  "editor/packaging/qtifw/config/config-macos.xml",
              )
          ]
          ifw_package = ET.parse(
              root / "editor/packaging/qtifw/packages/dev.jsonapiforge.editor/meta/package.xml"
          ).getroot()
          for ifw_config in ifw_configs:
              if ifw_config.tag != "Installer" or ifw_config.findtext("Version") != "0.5.2":
                  raise SystemExit("Qt IFW configuration identity/version mismatch")
              if not ifw_config.findtext("InstallerWindowIcon"):
                  raise SystemExit("Qt IFW window icon must be present")
              if any(ifw_config.find(name) is not None for name in ("Logo", "Banner", "Watermark", "Background", "PageListPixmap")):
                  raise SystemExit("Large QWizard pixmaps must not be added to the installer UI")
          if ifw_package.findtext("Name") != "dev.jsonapiforge.editor":
              raise SystemExit("Qt IFW component identity mismatch")
          if not (ifw_package.findtext("Version") or "").startswith("0.5.2-"):
              raise SystemExit("Qt IFW component version mismatch")
          licenses = ifw_package.findall("./Licenses/License")
          if len(licenses) != 1 or licenses[0].attrib.get("file") != "license.txt":
              raise SystemExit("Qt IFW package must present the project license")
          unpinned = []
          for workflow in (root / ".github/workflows").glob("*.yml"):
              for number, line in enumerate(workflow.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.search(r"\buses:\s*[^@\s]+@([^\s#]+)", line)
                  if match and not re.fullmatch(r"[0-9a-f]{40}", match.group(1)):
                      unpinned.append(f"{workflow}:{number}: {match.group(1)}")
          if unpinned:
              raise SystemExit(f"workflow actions must use immutable commit SHAs: {unpinned}")
          if (root / "editor/resources/logo.png").stat().st_size < 100_000:
              raise SystemExit("canonical Editor logo appears truncated")
          catalog = json.loads((root / "editor/resources/templates/catalog.json").read_text())
          if len(catalog.get("templates", [])) != 8:
              raise SystemExit("Editor must ship exactly eight reviewed starter templates")
          links = [
              line.split(maxsplit=3)[-1]
              for line in subprocess.check_output(["git", "ls-files", "-s"], text=True).splitlines()
              if line.startswith("120000 ")
          ]
          if links:
              raise SystemExit(f"symlinks are not allowed in Editor source: {links}")
          PY
          for helper in editor/packaging/qtifw/*.sh; do bash -n "$helper"; done
          python -m unittest discover -s editor/tests -p "test_*.py" -v
          python scripts/check_manifest.py
          git diff --check

  build:
    name: ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x64 portable ZIP + Qt IFW installer
            artifact: linux-x64
            ifw_package: QtInstallerFramework-linux-x64-4.8.1.run
            ifw_sha256: 4b6f61a81b6560b27e40d5a25584685a8407642ac5430ba91e503f9b31986797
          - os: ubuntu-24.04-arm
            label: Linux ARM64 portable ZIP + Qt IFW installer
            artifact: linux-arm64
            ifw_package: QtInstallerFramework-linux-arm64-4.8.1.run
            ifw_sha256: 2f1da1df46ac7f42b137d931e7c6d6ce35fc921016cf583cbede682777265426
          - os: windows-2022
            label: Windows x64 portable ZIP + Upgrade/Repair installer
            artifact: windows-x64
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            cmake_generator: Visual Studio 17 2022
            ifw_package: QtInstallerFramework-windows-x64-4.8.1.exe
            ifw_sha256: b0a7c6816dfaff7d571c9e5350fc08952f12022be87a28f6d8d36a78428c6210
          - os: windows-11-arm
            label: Windows ARM64 portable ZIP + Upgrade/Repair installer
            artifact: windows-arm64
            qt_arch: win64_msvc2022_arm64
            cmake_arch: ARM64
            cmake_generator: Visual Studio 18 2026
            ifw_package: QtInstallerFramework-windows-arm64-4.8.1.exe
            ifw_sha256: 135ebdc05f291ff62ca5dd4fb93790f97885854280dc06928daa80f46a7fd494
          - os: macos-15-intel
            label: macOS Intel portable ZIP + Qt IFW DMG
            artifact: macos-x64
            ifw_package: QtInstallerFramework-macOS-x64-4.8.1.dmg
            ifw_sha256: f63b46c8e5b9c9fe5e42999bd94886cc827b0a951012b3c55d31c60576734bcd
          - os: macos-15
            label: macOS ARM64 portable ZIP + Qt IFW compatibility DMG
            artifact: macos-arm64
            ifw_package: QtInstallerFramework-macOS-x64-4.8.1.dmg
            ifw_sha256: f63b46c8e5b9c9fe5e42999bd94886cc827b0a951012b3c55d31c60576734bcd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install native Qt and packaging tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            file libtiff6 libwebpdemux2 libwebpmux3 libxcb-cursor0 \
            ninja-build qt6-base-dev qt6-base-dev-tools zip
          # Qt WebEngine is optional on architectures where Ubuntu does not
          # publish the package; the Editor keeps its external-browser fallback.
          sudo apt-get install --no-install-recommends -y qt6-webengine-dev || \
            echo "Qt WebEngine unavailable; building the secure browser-fallback variant."
      - name: Set up Python for Qt tools
        if: runner.os != 'Linux'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Qt on Windows x64
        if: matrix.artifact == 'windows-x64'
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1, direct Node 24 action
        with:
          version: "6.8.3"
          aqtversion: "==3.3.0"
          host: windows
          arch: ${{ matrix.qt_arch }}
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Install native Qt on Windows ARM64
        if: matrix.artifact == 'windows-arm64'
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1, direct Node 24 action
        with:
          version: "6.8.3"
          aqtversion: "==3.3.0"
          host: windows_arm64
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Install verified official Qt IFW on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="${{ matrix.ifw_package }}"
          url="https://download.qt.io/official_releases/qt-installer-framework/4.8.1/$package"
          installer="${{ runner.temp }}/$package"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$installer" "$url"
          echo "${{ matrix.ifw_sha256 }}  $installer" | sha256sum -c -
          chmod 0755 "$installer"
          ifw_root="${{ runner.temp }}/qt-ifw"
          QT_QPA_PLATFORM=offscreen "$installer" --root "$ifw_root" \
            --accept-licenses --default-answer --confirm-command install
          binary_creator=$(find "$ifw_root" -type f -name binarycreator -perm -111 -print -quit)
          test -n "$binary_creator"
          bash editor/packaging/qtifw/prepare-linux-tools.sh "$binary_creator" >> "$GITHUB_PATH"
      - name: Install checksum-verified Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = ./editor/packaging/windows/prepare-tools.ps1 -ToolDirectory (Join-Path $env:RUNNER_TEMP 'forge-inno-tools')
          Split-Path -Parent $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install verified official Qt IFW on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ $(uname -m) == arm64 ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          package="${{ matrix.ifw_package }}"
          url="https://download.qt.io/official_releases/qt-installer-framework/4.8.1/$package"
          installer="${{ runner.temp }}/$package"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$installer" "$url"
          echo "${{ matrix.ifw_sha256 }}  $installer" | shasum -a 256 -c -
          mount_point="${{ runner.temp }}/qt-ifw-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$installer"
          cleanup_mount() { bash editor/packaging/qtifw/detach-dmg.sh "$mount_point"; }
          trap cleanup_mount EXIT
          ifw_installer=$(find "$mount_point" -path '*/Contents/MacOS/*' -type f -perm -111 -print -quit)
          test -n "$ifw_installer"
          ifw_root="${{ runner.temp }}/qt-ifw"
          QT_QPA_PLATFORM=offscreen "$ifw_installer" --root "$ifw_root" \
            --accept-licenses --default-answer --confirm-command install
          binary_creator=$(find "$ifw_root" -type f -name binarycreator -perm -111 -print -quit)
          test -n "$binary_creator"
          "$binary_creator" --help
          dirname "$binary_creator" >> "$GITHUB_PATH"
          cleanup_mount
          trap - EXIT
      - name: Install Qt on macOS
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1, direct Node 24 action
        with:
          version: "6.8.3"
          aqtversion: "==3.3.0"
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Configure Linux or macOS
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DFORGE_EDITOR_WARNINGS_AS_ERRORS=ON
          -DFORGE_EDITOR_REQUIRE_WEBENGINE=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
      - name: Configure matching MSVC architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -G "${{ matrix.cmake_generator }}"
          -A "${{ matrix.cmake_arch }}"
          -DBUILD_TESTING=ON
          -DFORGE_EDITOR_WARNINGS_AS_ERRORS=ON
          -DFORGE_EDITOR_REQUIRE_WEBENGINE=${{ matrix.artifact == 'windows-x64' && 'ON' || 'OFF' }}
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Check out the verified server contract
        if: matrix.artifact == 'linux-x64'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 4f820e2ff7209904d20e40470db4e204432f4bfc
          path: build/server-contract
          persist-credentials: false
      - name: Install canonical server contract dependencies
        if: matrix.artifact == 'linux-x64'
        run: python -m pip install -r build/server-contract/requirements.txt
      - name: Exercise native Editor against the canonical server
        if: matrix.artifact == 'linux-x64'
        run: >-
          python editor/tests/run_server_contract.py
          --server-source build/server-contract
          --test-binary build/editor/forge_editor_ui_tests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Preserve native test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: editor-test-diagnostics-${{ matrix.artifact }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/editor/editor-tests.xml
            build/editor/editor-ui-tests.xml
            build/editor/editor-contract-tests.xml
          if-no-files-found: warn
      - name: Stage install tree
        run: cmake --install build --config Release --prefix stage
      - name: Package Linux multi-file application and Qt IFW installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'printf "::error::Linux packaging failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND"' ERR
          mkdir -p artifacts
          bash editor/packaging/linux/bundle-qt.sh stage
          install -m 0755 editor/packaging/linux/launcher.sh stage/json-api-forge-editor
          cp EDITOR.md LICENSE stage/
          python editor/packaging/stage-notices.py stage
          count=$(find stage -type f | wc -l)
          test "$count" -gt 20
          QT_QPA_PLATFORM=offscreen stage/json-api-forge-editor \
            --window-size 1024x640 \
            --screenshot "artifacts/editor-packaged-${{ matrix.artifact }}.png"
          test -s "artifacts/editor-packaged-${{ matrix.artifact }}.png"
          QT_QPA_PLATFORM=offscreen stage/json-api-forge-editor \
            --window-size 1024x640 --visual-preview \
            --screenshot "artifacts/editor-visual-${{ matrix.artifact }}.png"
          test -s "artifacts/editor-visual-${{ matrix.artifact }}.png"
          archive="JSON-API-Forge-Editor-v0.5.2-${{ matrix.artifact }}.zip"
          (cd stage && zip -9 -r "../artifacts/$archive" .)
          installer="JSON-API-Forge-Editor-v0.5.2-${{ matrix.artifact }}-setup.run"
          bash editor/packaging/qtifw/build-installer.sh stage "artifacts/$installer" linux
          chmod 0755 "artifacts/$installer"
          file "artifacts/$installer" | grep -E 'executable|ELF'
          installed="${{ runner.temp }}/editor-installed-${{ matrix.artifact }}"
          QT_QPA_PLATFORM=offscreen "artifacts/$installer" --root "$installed" \
            --accept-licenses --default-answer --confirm-command install
          test -x "$installed/bin/JSON-API-Forge-Editor"
          QT_QPA_PLATFORM=offscreen "$installed/json-api-forge-editor" \
            --window-size 1024x640 --screenshot "artifacts/editor-installed-${{ matrix.artifact }}.png"
          test -s "artifacts/editor-installed-${{ matrix.artifact }}.png"
          (cd artifacts && sha256sum "$archive" "$installer" > SHA256SUMS)
          (cd artifacts && sha256sum "$archive" > "$archive.sha256")
          (cd artifacts && sha256sum "$installer" > "$installer.sha256")
      - name: Package Windows multi-file application and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = Get-ChildItem -Path stage -Filter JSON-API-Forge-Editor.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed Editor executable not found" }
          & windeployqt --release --no-translations --compiler-runtime $exe.FullName
          Copy-Item EDITOR.md,LICENSE -Destination stage
          python editor/packaging/stage-notices.py stage
          if ($LASTEXITCODE -ne 0) { throw "Dependency notice staging failed" }
          $runtimeRoot = $exe.Directory.FullName
          foreach ($relative in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "platforms/qwindows.dll")) {
            if (-not (Test-Path (Join-Path $runtimeRoot $relative) -PathType Leaf)) {
              throw "windeployqt did not stage required runtime file: $relative"
            }
          }
          if ("${{ matrix.artifact }}" -eq "windows-x64") {
            foreach ($relative in @("Qt6WebEngineCore.dll", "Qt6WebEngineWidgets.dll", "QtWebEngineProcess.exe", "resources/qtwebengine_resources.pak")) {
              if (-not (Test-Path (Join-Path $runtimeRoot $relative) -PathType Leaf)) {
                throw "Embedded calls runtime is incomplete: $relative"
              }
            }
          }
          $count = (Get-ChildItem stage -Recurse -File).Count
          if ($count -lt 12) { throw "Portable application is incomplete: only $count files" }
          $screenshot = Join-Path (Resolve-Path artifacts) "editor-packaged-${{ matrix.artifact }}.png"
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -WindowStyle Hidden -FilePath $exe.FullName -ArgumentList @("--window-size", "1024x640", "--screenshot", $screenshot) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged Editor exited with code $($process.ExitCode)" }
          if (-not (Test-Path $screenshot) -or (Get-Item $screenshot).Length -eq 0) {
            throw "Packaged Editor screenshot smoke test failed"
          }
          $visualScreenshot = Join-Path (Resolve-Path artifacts) "editor-visual-${{ matrix.artifact }}.png"
          $visualProcess = Start-Process -WindowStyle Hidden -FilePath $exe.FullName -ArgumentList @('--window-size', '1024x640', '--visual-preview', '--screenshot', ('"' + $visualScreenshot + '"')) -Wait -PassThru
          if ($visualProcess.ExitCode -ne 0 -or -not (Test-Path $visualScreenshot -PathType Leaf)) { throw "Packaged Visual smoke test failed" }
          $archive = "JSON-API-Forge-Editor-v0.5.2-${{ matrix.artifact }}.zip"
          Compress-Archive -Path stage/* -DestinationPath "artifacts/$archive"
          $outPath = Join-Path (Resolve-Path artifacts) "JSON-API-Forge-Editor-v0.5.2-${{ matrix.artifact }}-setup.exe"
          ./editor/packaging/windows/build-installer.ps1 -StageDir stage -OutputFile $outPath
          $installer = Split-Path -Leaf $outPath
          if ((Get-Item "artifacts/$installer").Length -lt 1000000) { throw "Windows installer appears truncated" }
          $env:FORGE_WINDOWS_INSTALLER = $outPath
          $env:FORGE_INSTALLER_PAYLOAD = (Resolve-Path stage).Path
          python editor/tests/test_windows_installer.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows install/repair/upgrade contract failed' }
          $installed = Join-Path $env:RUNNER_TEMP "editor-installed-${{ matrix.artifact }}"
          $installProcess = Start-Process -FilePath $outPath -WindowStyle Hidden -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', ('/DIR="' + $installed + '"'))
          if ($installProcess.ExitCode -ne 0) { throw "Generated installer failed: $($installProcess.ExitCode)" }
          $installedExe = Join-Path $installed "bin/JSON-API-Forge-Editor.exe"
          if (-not (Test-Path $installedExe -PathType Leaf)) { throw "Installer did not install the Editor" }
          $installedScreenshot = Join-Path (Resolve-Path artifacts) "editor-installed-${{ matrix.artifact }}.png"
          $installedProcess = Start-Process -WindowStyle Hidden -FilePath $installedExe -Wait -PassThru -ArgumentList @('--window-size', '1024x640', '--screenshot', ('"' + $installedScreenshot + '"'))
          if ($installedProcess.ExitCode -ne 0 -or -not (Test-Path $installedScreenshot -PathType Leaf)) { throw "Installed Editor smoke test failed" }
          foreach ($name in @($archive, $installer)) {
            $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText(
              (Join-Path (Resolve-Path artifacts) "$name.sha256"),
              "$hash  $name" + [Environment]::NewLine,
              [Text.UTF8Encoding]::new($false)
            )
          }
      - name: Package macOS multi-file application and Qt IFW installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'printf "::error::macOS packaging failed at line %s: %s\n" "$LINENO" "$BASH_COMMAND"' ERR
          mkdir -p artifacts
          app_path="stage/JSON-API-Forge-Editor.app"
          test -d "$app_path"
          macdeployqt "$app_path" -always-overwrite
          cp EDITOR.md LICENSE stage/
          python editor/packaging/stage-notices.py stage
          test "$(find "$app_path" -type f | wc -l)" -gt 20
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu \
            "$app_path/Contents/MacOS/JSON-API-Forge-Editor" \
            --window-size 1024x640 \
            --screenshot "artifacts/editor-packaged-${{ matrix.artifact }}.png"
          test -s "artifacts/editor-packaged-${{ matrix.artifact }}.png"
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu \
            "$app_path/Contents/MacOS/JSON-API-Forge-Editor" \
            --window-size 1024x640 --visual-preview \
            --screenshot "artifacts/editor-visual-${{ matrix.artifact }}.png"
          test -s "artifacts/editor-visual-${{ matrix.artifact }}.png"
          archive="JSON-API-Forge-Editor-v0.5.2-${{ matrix.artifact }}.zip"
          ditto -c -k --sequesterRsrc --keepParent stage "artifacts/$archive"
          installer="JSON-API-Forge-Editor-v0.5.2-${{ matrix.artifact }}-setup.dmg"
          bash editor/packaging/qtifw/build-installer.sh stage "artifacts/$installer" macos \
            2>&1 | tee "artifacts/installer-build-${{ matrix.artifact }}.log"
          mount_point="${{ runner.temp }}/editor-setup-${{ matrix.artifact }}"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "artifacts/$installer"
          cleanup_setup() { bash editor/packaging/qtifw/detach-dmg.sh "$mount_point"; }
          trap cleanup_setup EXIT
          setup_binary=$(find "$mount_point/JSON API Forge Editor Setup.app/Contents/MacOS" \
            -type f -perm -111 -print -quit)
          test -n "$setup_binary"
          QT_QPA_PLATFORM=offscreen "$setup_binary" --help
          cleanup_setup
          trap - EXIT
          (cd artifacts && shasum -a 256 "$archive" > "$archive.sha256")
          (cd artifacts && shasum -a 256 "$installer" > "$installer.sha256")
      - name: Preserve packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: editor-packaging-diagnostics-${{ matrix.artifact }}
          path: |
            artifacts/*.log
            artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: JSON-API-Forge-Editor-v0.5.2-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  sanitizers:
    name: Linux ASan + UBSan security test
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1, direct Node 24 action
        with:
          version: "6.8.3"
          aqtversion: "==3.3.0"
          cache: true
      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DFORGE_EDITOR_WARNINGS_AS_ERRORS=ON
          -DFORGE_EDITOR_ENABLE_SANITIZERS=ON
      - name: Compile sanitizer build
        run: cmake --build build/sanitizers --parallel 2
      - name: Run memory and undefined-behavior checks
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  bundle:
    name: Combined Editor release bundle
    needs: [build, sanitizers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: JSON-API-Forge-Editor-v0.5.2-*64
          path: downloads
      - name: Verify installers and portable archives
        run: |
          set -euo pipefail
          find downloads -type f -name '*.sha256' -print0 | while IFS= read -r -d '' checksum; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done
          test "$(find downloads -type f -name '*.zip' | wc -l)" -eq 6
          test "$(find downloads -type f \( -name '*-setup.run' -o -name '*-setup.exe' -o -name '*-setup.dmg' \) | wc -l)" -eq 6
          mkdir release-assets
          find downloads -type f \( \
            -name 'JSON-API-Forge-Editor-v0.5.2-*.zip' -o \
            -name 'JSON-API-Forge-Editor-v0.5.2-*-setup.run' -o \
            -name 'JSON-API-Forge-Editor-v0.5.2-*-setup.exe' -o \
            -name 'JSON-API-Forge-Editor-v0.5.2-*-setup.dmg' -o \
            -name 'JSON-API-Forge-Editor-v0.5.2-*.sha256' \
          \) -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 6
          test "$(find release-assets -maxdepth 1 -type f \( -name '*-setup.run' -o -name '*-setup.exe' -o -name '*-setup.dmg' \) | wc -l)" -eq 6
          test "$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 12
          cp EDITOR.md RELEASE_ASSETS.md LICENSE LICENSE-FAQ.md NOTICE.md THIRD_PARTY_NOTICES.md TRADEMARK_POLICY.md AI_USAGE_POLICY.md LICENSE-HISTORY.md LICENSE-METADATA.json release-assets/
          (cd release-assets && find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*-setup.run' -o -name '*-setup.exe' -o -name '*-setup.dmg' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          folder = Path('release-assets')
          assets = {path.name: hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
                    for path in folder.iterdir() if path.suffix in ('.zip', '.exe', '.run', '.dmg')}
          proof = {'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                   'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'branch': 'Editor',
                   'version': '0.5.2', 'call_client_revision': 2, 'assets': assets}
          (folder / 'release-build.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
          python editor/packaging/validate-release.py release-assets --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          (cd release-assets && zip -9 -r ../JSON-API-Forge-Editor-v0.5.2-all-platforms.zip .)
          sha256sum JSON-API-Forge-Editor-v0.5.2-all-platforms.zip \
            > JSON-API-Forge-Editor-v0.5.2-all-platforms.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: JSON-API-Forge-Editor-v0.5.2-release-assets
          path: |
            release-assets/*
            JSON-API-Forge-Editor-v0.5.2-all-platforms.zip
            JSON-API-Forge-Editor-v0.5.2-all-platforms.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          overwrite: true
          name: Editor-v0.5.2-release-proof
          path: release-assets/release-build.json
          if-no-files-found: error
          retention-days: 30
