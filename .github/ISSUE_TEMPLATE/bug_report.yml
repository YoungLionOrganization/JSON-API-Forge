name: Bug report
description: Report a reproducible defect in an official JSON API Forge release
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or undisclosed vulnerability details here. Use SECURITY.md for security issues.
  - type: input
    id: version
    attributes:
      label: JSON API Forge version
      placeholder: 0.5.1
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.x
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Uvicorn / native ASGI
        - cPanel / Passenger bridge
        - Docker / container
        - Local development
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands/config snippets with all secrets removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: shell
