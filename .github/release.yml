changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - "dependabot[bot]"
  categories:
    - title: "Breaking Changes"
      labels:
        - breaking-change
    - title: "Features"
      labels:
        - enhancement
        - feature
    - title: "Fixes"
      labels:
        - bug
        - fix
    - title: "Documentation"
      labels:
        - documentation
    - title: "Security"
      labels:
        - security
    - title: "Other Changes"
      labels:
        - "*"
